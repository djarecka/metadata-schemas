name: Generate Schema Documentation

on:
  pull_request:
    paths:
      - 'docs/schemas/**/*.csv'
      - 'scripts/generate_schema_html.py'
      - 'scripts/generate_all_schema_docs.sh'
  push:
    branches: [main]
    paths:
      - 'docs/schemas/**/*.csv'
      - 'scripts/generate_schema_html.py'
      - 'scripts/generate_all_schema_docs.sh'
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate schema docs
        run: bash scripts/generate_all_schema_docs.sh

      - name: Commit generated docs
        run: |
          shopt -s globstar
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/schemas/**/*.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: regenerate schema HTML docs from CSV"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
