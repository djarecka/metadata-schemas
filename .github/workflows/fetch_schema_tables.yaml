name: Fetch Schema Tables from Google Sheets

on:
  push:
    paths:
      - 'config/schemas/**'
      - 'scripts/fetch_schema_table.py'
      - '.github/workflows/fetch_schema_tables.yaml'
  workflow_dispatch:
    inputs:
      schema:
        description: 'schema_name to fetch (leave blank for all configs)'
        required: false
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      # SCHEMA goes through the environment rather than being interpolated into
      # the script body, so a crafted dispatch input cannot inject shell.
      - name: Fetch schema tables
        env:
          SCHEMA: ${{ inputs.schema }}
        run: |
          if [ -n "$SCHEMA" ]; then
            python3 scripts/fetch_schema_table.py --schema "$SCHEMA"
          else
            python3 scripts/fetch_schema_table.py --all
          fi

      - name: Commit fetched tables
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/schemas
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh schema tables from Google Sheets"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
